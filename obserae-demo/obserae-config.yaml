cartography:
  networks:
    - name: DMZ
      cidr: 10.0.10.0/24
    - name: PREPROD
      cidr: 10.0.30.0/24
    - name: PROD
      cidr: 10.0.20.0/24
    - name: WORK
      cidr: 10.0.40.0/24
  hosts:
    - name: cf-dns01
      interfaces:
        - name: eth0
          network: internet4
          ip: 1.1.1.1
      services:
        - name: dns-tcp
          protocol: TCP
          port: 53
          interfaces:
            - eth0
        - name: dns-udp
          protocol: UDP
          port: 53
          interfaces:
            - eth0
    - name: dns
      interfaces:
        - name: eth0
          network: DMZ
          ip: 10.0.10.10
      services:
        - name: dns
          protocol: UDP
          port: 53
          interfaces:
            - eth0
    - name: docker-SSDP
      interfaces:
        - name: eth0
          network: internal4
          ip: 239.255.255.250
      services:
        - name: ssdp
          protocol: UDP
          port: 1900
          interfaces:
            - eth0
    - name: docker-bridges
      interfaces:
        - name: eth0
          network: DMZ
          ip: 10.0.10.1
        - name: eth1
          network: PROD
          ip: 10.0.20.1
        - name: eth2
          network: PREPROD
          ip: 10.0.30.1
        - name: eth3
          network: WORK
          ip: 10.0.40.1
    - name: google-dns09
      interfaces:
        - name: eth0
          network: internet4
          ip: 9.9.9.9
      services:
        - name: dns-tcp
          protocol: TCP
          port: 53
          interfaces:
            - eth0
        - name: dns-udp
          protocol: UDP
          port: 53
          interfaces:
            - eth0
    - name: pp-backend
      interfaces:
        - name: eth0
          network: PREPROD
          ip: 10.0.30.20
    - name: pp-caddy
      interfaces:
        - name: eth0
          network: PREPROD
          ip: 10.0.30.10
      services:
        - name: https
          protocol: TCP
          port: 443
          interfaces:
            - eth0
    - name: pp-db
      interfaces:
        - name: eth0
          network: PREPROD
          ip: 10.0.30.30
      services:
        - name: postgres
          protocol: TCP
          port: 5432
          interfaces:
            - eth0
    - name: prod-backend
      interfaces:
        - name: eth0
          network: PROD
          ip: 10.0.20.20
    - name: prod-caddy
      interfaces:
        - name: eth0
          network: PROD
          ip: 10.0.20.10
      services:
        - name: http
          protocol: TCP
          port: 80
          interfaces:
            - eth0
        - name: https
          protocol: TCP
          port: 443
          interfaces:
            - eth0
        - name: postgres
          protocol: TCP
          port: 5432
          interfaces:
            - eth0
        - name: ssh
          protocol: TCP
          port: 22
          interfaces:
            - eth0
    - name: prod-db
      interfaces:
        - name: eth0
          network: PROD
          ip: 10.0.20.30
      services:
        - name: postgres
          protocol: TCP
          port: 5432
          interfaces:
            - eth0
    - name: router
      interfaces:
        - name: eth0
          network: DMZ
          ip: 10.0.10.2
        - name: eth1
          network: PROD
          ip: 10.0.20.2
        - name: eth2
          network: PREPROD
          ip: 10.0.30.2
        - name: eth3
          network: WORK
          ip: 10.0.40.2
      services:
        - name: http
          protocol: TCP
          port: 80
          interfaces:
            - eth1
        - name: https
          protocol: TCP
          port: 443
          interfaces:
            - eth1
        - name: postgres
          protocol: TCP
          port: 5432
          interfaces:
            - eth1
        - name: ssh
          protocol: TCP
          port: 22
          interfaces:
            - eth1
    - name: ws1-dev
      interfaces:
        - name: eth0
          network: WORK
          ip: 10.0.40.11
    - name: ws2-ops
      interfaces:
        - name: eth0
