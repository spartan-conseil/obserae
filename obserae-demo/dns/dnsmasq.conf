# =============================================================================
#  Internal DNS (DMZ) - dnsmasq
# -----------------------------------------------------------------------------
#  - Resolves internal names in the corp.lan zone (prod / preprod).
#  - Forwards everything else to public resolvers (dmz -> internet traffic).
#  The workstations use this DNS (see "dns:" in docker-compose.yml), which
#  continuously generates work -> dmz (UDP/53) flows, then dmz -> internet.
# =============================================================================

# Listen only on the DMZ interface + loopback.
listen-address=10.0.10.10,127.0.0.1
bind-interfaces

# Do not read /etc/resolv.conf: we set the upstreams ourselves.
no-resolv
domain-needed
bogus-priv

# Public resolvers (generate the "outbound DNS" traffic from the DMZ).
server=1.1.1.1
server=9.9.9.9

# Internal company zone.
local=/corp.lan/
address=/dns.corp.lan/10.0.10.10

# DMZ -- FreeIPA (identity / LDAP)
address=/ipa.corp.lan/10.0.10.20

# Production
address=/caddy-prod.corp.lan/10.0.20.10
address=/www.corp.lan/10.0.20.10
address=/backend-prod.corp.lan/10.0.20.20
address=/db-prod.corp.lan/10.0.20.30

# Pre-production
address=/caddy-preprod.corp.lan/10.0.30.10
address=/staging.corp.lan/10.0.30.10
address=/backend-preprod.corp.lan/10.0.30.20
address=/db-preprod.corp.lan/10.0.30.30

# A bit of logging (visible via: docker compose logs dns).
log-queries
