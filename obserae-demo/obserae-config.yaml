flow_matrix:
  rules:
    - name: db-pp-backent-to-db
      src: host:pp-backend
      src_service: '*'
      dst: host:pp-db
      dst_service: postgres
      protocol: TCP
      enabled: true
      tags:
        - postgres
        - pp
    - name: db-prod-backent-to-db
      src: host:prod-backend
      src_service: '*'
      dst: host:prod-db
      dst_service: postgres
      protocol: TCP
      enabled: true
      tags:
        - postgres
        - prod
    - name: dns-dmz-to-cloudflare-tcp
      src: host:dns
      src_service: '*'
      dst: group:public-dns-grp
      dst_service: dns-tcp
      protocol: TCP
      enabled: true
      tags:
        - dns
    - name: dns-dmz-to-cloudflare-udp
      src: host:dns
      src_service: '*'
      dst: group:public-dns-grp
      dst_service: dns-udp
      protocol: UDP
      enabled: true
      tags:
        - dns
    - name: dns-work-to-dmz
      src: group:work-grp
      src_service: '*'
      dst: host:dns
      dst_service: dns
      protocol: UDP
      enabled: true
      tags:
        - dns
    - name: docker-ssdp
      src: host:docker-bridges
      src_service: '*'
      dst: host:docker-SSDP
      dst_service: ssdp
      protocol: UDP
      enabled: true
      tags:
        - docker
        - internal
    - name: http-pp-caddy-to-backend
      src: host:pp-caddy
      src_service: '*'
      dst: host:pp-backend
      dst_service: 8000/TCP
      protocol: TCP
      enabled: true
      tags:
        - backend
        - pp
    - name: http-prod-caddy-to-backend
      src: host:prod-caddy
      src_service: '*'
      dst: host:prod-backend
      dst_service: 8000/TCP
      protocol: TCP
      enabled: true
      tags:
        - backend
        - prod
    - name: https-work-to-internet4-443
      src: group:work-grp
      src_service: '*'
      dst: internet4
      dst_service: 443/TCP
      protocol: TCP
      enabled: true
      tags:
        - https
        - internet
        - work
    - name: https-work-to-preprod
      src: group:work-grp
      src_service: '*'
      dst: host:pp-caddy
      dst_service: https
      protocol: TCP
      enabled: true
      tags:
        - https
        - pp
    - name: https-work-to-prod
      src: group:work-grp
      src_service: '*'
      dst: host:prod-caddy
      dst_service: https
      protocol: TCP
      enabled: true
      tags:
        - https
        - prod
